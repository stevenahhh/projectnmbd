<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="./base.css"></head><body><div class="slide"><div class="grid g2">
<div class="c dark s12 mid">
<p class="eyebrow">이 서비스가 파는 것</p>
<h2>기여도를 저장하지 않습니다. 그래서 바꿔둘 곳도 없습니다.</h2>
</div>
<div class="c plain s4">
<h3>① 같은 순간, 같은 묶음</h3>
<p>문서 저장이든 할 일 완료든, 그 행동과 같은 묶음으로 팀 기록장에 한 줄이 남습니다. 기록만 빼먹는 경로가 없습니다.</p>
</div>
<div class="c coral s4">
<h3>② 시각은 서버가 찍습니다</h3>
<p>시각을 정하는 주체가 사용자가 아니라 서버입니다. 본인도 나중에 그 시각을 옮길 수 없습니다.</p>
</div>
<div class="c teal s4">
<h3>③ 열 때마다 다시 계산</h3>
<p>퍼센트는 어디에도 저장하지 않습니다. 화면을 열 때마다 기록장을 접어 그 자리에서 계산합니다.</p>
</div>
</div><p class="num">5</p></div></body></html>
